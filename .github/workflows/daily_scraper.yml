name: Kamyabi Daily Government Jobs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: kamyabi-govt-jobs-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kamyabi-govt-jobs-v1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run scraper
        run: python main.py

      - name: Run QA
        run: python qa.py

      - name: Commit test data
        working-directory: .
        run: |
          git config user.name "kamyabi-bot"
          git config user.email "kamyabi-bot@users.noreply.github.com"
          git add kamyabi-govt-jobs-v1/data/ kamyabi-govt-jobs-v1/logs/
          git diff --cached --quiet || git commit -m "data: daily government jobs update"
          git push
